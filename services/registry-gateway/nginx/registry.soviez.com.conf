# Soviez Registry Gateway — TLS termination reverse proxy
# Canonical production: registry.soviez.com
# Staging:              registry-staging.soviez.com
#
# Replace CERT_FULLCHAIN_PATH and CERT_PRIVKEY_PATH with real certificate paths
# (e.g. Let's Encrypt). Do not commit private keys into this repository.

upstream soviez_registry_gateway {
    server 127.0.0.1:8087;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name registry.soviez.com;

    # ACME / redirect — adjust if using a different cert workflow
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name registry.soviez.com;

    # PLACEHOLDERS — replace before enabling the site
    ssl_certificate     CERT_FULLCHAIN_PATH;
    ssl_certificate_key CERT_PRIVKEY_PATH;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Registry clients may stream large layers
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /live {
        proxy_pass http://soviez_registry_gateway;
    }

    location = /ready {
        proxy_pass http://soviez_registry_gateway;
    }

    location = /health {
        proxy_pass http://soviez_registry_gateway;
    }

    location / {
        proxy_pass http://soviez_registry_gateway;
    }
}

