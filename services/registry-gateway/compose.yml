# Soviez Registry Gateway — Compose (Docker Compose v2)
# Builds and runs the Node OCI pull proxy. TLS is expected at nginx on the host.
# Upstream Hub credentials stay in the gateway env only — never returned to clients.

name: soviez-registry-gateway

services:
  registry-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: soviez-registry-gateway:${SOVIEZ_RGW_IMAGE_TAG:-0.1.0}
    container_name: soviez-registry-gateway
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8087}
      SOVIEZ_REGISTRY_TICKET_PUBLIC_KEYS_JSON: ${SOVIEZ_REGISTRY_TICKET_PUBLIC_KEYS_JSON:-}
      SOVIEZ_UPSTREAM_REGISTRY_HOST: ${SOVIEZ_UPSTREAM_REGISTRY_HOST:-registry-1.docker.io}
      SOVIEZ_UPSTREAM_REGISTRY_USER: ${SOVIEZ_UPSTREAM_REGISTRY_USER:-}
      SOVIEZ_UPSTREAM_REGISTRY_TOKEN: ${SOVIEZ_UPSTREAM_REGISTRY_TOKEN:-}
      # Dev/mock override only — leave unset in production
      SOVIEZ_UPSTREAM_BASE_URL: ${SOVIEZ_UPSTREAM_BASE_URL:-}
    ports:
      # Bind to loopback by default; nginx terminates TLS on 443
      - "${SOVIEZ_RGW_BIND:-127.0.0.1}:${PORT:-8087}:8087"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Intentionally no docker.sock, no privileged, no host network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8087/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
